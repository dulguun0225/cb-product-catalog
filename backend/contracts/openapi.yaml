info:
  description: |-
    The core-banking product family catalog. A product family carries an opaque identifier assigned by the service, a client-supplied immutable family code, a name, and a lifecycle status of ACTIVE or RETIRED. Families are created, read by identifier, listed a keyset page at a time, and retired. Retirement is terminal and idempotent; no operation returns a family to ACTIVE and no operation changes a persisted family code. This service declares no authentication: it returns no 401 and no 403 (spec 1, OI-005).

    Named gap, open at this gate: the protocol-level failures the framework produces before any operation below is entered - 400 on a body that is not readable JSON, 405, 406, 415 - are RFC 9457 problem documents with the right status, but the approved error-code catalog has no member for them, so they carry no code member. They are therefore not declared as responses on the operations below. See the design's OI-006 and decision D-08.
  title: Product family catalog
  version: 0.1.0
openapi: 3.1.0
paths:
  /actuator/health:
    get:
      description: "Spring Boot Actuator health, with the datasource indicator on. Read by the container orchestrator's probe and by the deploy stage. It returns no family data."
      operationId: health
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
          description: The service is able to serve requests.
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
          description: A dependency the service needs is not available.
      summary: Report whether the service is able to serve requests
      tags:
      - Operations
      x-requirements:
      - FR-014
  /v1/product-families:
    get:
      description: "Returns one keyset page ordered by familyCode ascending, with the opaque identifier appended as the final tiebreak only. The identifier is not part of the declared sort vocabulary, and the relative order of two families sharing a family code is an explicit non-promise of this contract - nothing may depend on it. There is no offset, page or pageNumber parameter and no total count. nextCursor is null only on the last page, and a non-null nextCursor always fetches a further page. A cursor is issued by the service, is integrity-sealed, and carries the sort specification it was issued for; clients pass one back unmodified and never construct or edit one. This page is not a snapshot: a family created after the first page may appear on a later one. With no status parameter, families of every status are returned (spec OI-003)."
      operationId: listProductFamilies
      parameters:
      - description: Return only families whose status equals this value.
        in: query
        name: status
        required: false
        schema:
          $ref: "#/components/schemas/ProductFamilyStatus"
      - description: "The maximum number of families in the page. It must be an integer between 1 and 100. Any value the declared bounds do not admit - above the maximum, below the minimum, absent-but-present as an empty value, repeated, not an integer, or beyond the range of a 32-bit integer - is rejected with 400 LIMIT_ABOVE_MAXIMUM carrying a violation member that says which. It is never silently clamped to the maximum and never silently defaulted."
        in: query
        name: limit
        required: false
        schema:
          default: 20
          format: int32
          maximum: 100
          minimum: 1
          type: integer
      - description: "The nextCursor of the previous page, passed back unmodified. It is integrity-sealed and carries the key identifier it was sealed under, so the sealing key can be rotated without invalidating cursors already issued. It is sealed, not confidential - a client can read the sort specification and the last row's values out of it, and cannot forge one - and forging one would grant no read the caller does not already have."
        in: query
        name: cursor
        required: false
        schema:
          maxLength: 512
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductFamilyPage"
          description: One page of product families.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "The limit is not an integer between 1 and 100 (LIMIT_ABOVE_MAXIMUM, with a violation member of ABOVE_MAX, BELOW_MIN or NOT_AN_INTEGER and the min and max members that bound it), the cursor failed its integrity check or was issued for a different sort specification (CURSOR_INVALID), or the status filter is neither ACTIVE nor RETIRED (STATUS_FILTER_INVALID)."
        "500":
          $ref: "#/components/responses/InternalError"
      summary: "List product families, one keyset page at a time"
      tags:
      - Product families
      x-requirements:
      - FR-006
      - FR-007
      - FR-008
      - FR-009
      - FR-020
      - FR-021
      - FR-022
      - FR-023
    post:
      description: Persists a new product family with status ACTIVE and an opaque identifier the service assigns. The family code is stored exactly as supplied and can never be changed afterwards.
      operationId: createProductFamily
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductFamilyRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductFamily"
          description: The family was persisted.
          headers:
            Location:
              description: "The created family, addressed by its opaque identifier."
              required: true
              schema:
                format: uri-reference
                type: string
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "The family code is not 3 to 20 characters of A-Z and 0-9 (FAMILY_CODE_INVALID), or the name is not 1 to 120 characters (FAMILY_NAME_INVALID)."
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: A persisted family already holds that family code (FAMILY_CODE_DUPLICATE).
        "500":
          $ref: "#/components/responses/InternalError"
      summary: Register a product family
      tags:
      - Product families
      x-requirements:
      - FR-001
      - FR-002
      - FR-003
      - FR-004
      - FR-016
      - FR-017
      - FR-018
      - FR-023
  /v1/product-families/{id}:
    get:
      description: Returns the family addressed by the opaque identifier. The family code is not an identifier in a URL and cannot address a family here.
      operationId: getProductFamily
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductFamily"
          description: The family.
        "404":
          $ref: "#/components/responses/FamilyNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
      summary: Read one product family by its opaque identifier
      tags:
      - Product families
      x-requirements:
      - FR-005
      - FR-019
      - FR-023
    parameters:
    - $ref: "#/components/parameters/FamilyId"
  /v1/product-families/{id}/retire:
    parameters:
    - $ref: "#/components/parameters/FamilyId"
    post:
      description: "Transitions an ACTIVE family to RETIRED. RETIRED is terminal: a retire request against an already RETIRED family is idempotent and returns that family unchanged, including its updatedAt. There is no request body and no operation that returns a family to ACTIVE."
      operationId: retireProductFamily
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductFamily"
          description: "The family, now RETIRED."
        "404":
          $ref: "#/components/responses/FamilyNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
      summary: Retire a product family
      tags:
      - Product families
      x-requirements:
      - FR-010
      - FR-011
      - FR-013
      - FR-019
      - FR-023
tags:
- description: "Registration, retrieval, listing and retirement of product families."
  name: Product families
- description: Deployment readiness.
  name: Operations
